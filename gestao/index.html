<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão — Kaliny Girardi Advocacia</title><link rel="stylesheet" href="../css/style.css"><meta name="robots" content="noindex,nofollow,noarchive">
<style>
.login-body{opacity:0;animation:pageIn .7s ease-out forwards;}
.login-card{animation:cardIn .9s cubic-bezier(.22,.8,.24,1) .12s both;}
.login-logo{animation:itemIn .65s ease-out .32s both;}
.login-card .eyebrow{animation:itemIn .6s ease-out .48s both;}
.login-card h1{animation:itemIn .65s ease-out .60s both;}
.login-card>p{animation:itemIn .65s ease-out .72s both;}
.login-motto{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.4;font-style:italic;font-weight:400;letter-spacing:0;color:#8A6B57;text-align:center;margin:18px 0 22px;animation:itemIn .7s ease-out .84s both;}
.login-card form{animation:itemIn .7s ease-out .98s both;}
.login-back{animation:itemIn .6s ease-out 1.22s both;}
.login-card input,.login-card button{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background-color .22s ease;}
.login-card input:focus{transform:translateY(-1px);}
.login-card button:hover{transform:translateY(-2px);}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes itemIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.login-body,.login-card,.login-logo,.login-card .eyebrow,.login-card h1,.login-card>p,.login-motto,.login-card form,.login-back{animation:none!important;opacity:1!important;transform:none!important}}
</style><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#5a3b2b"></head><body class="login-body"><div class="login-card"><img class="login-logo" src="../assets/logo.jpg" alt="Logo Kaliny Girardi"><span class="eyebrow">Acesso administrativo</span><h1>Bem-vinda, Kaliny.</h1><p>Acesse o painel do escritório.</p><div class="login-motto">Clareza para decidir. Coragem para seguir.</div><form id="loginForm"><div class="field"><label>E-mail</label><input type="email" name="email" placeholder="seu e-mail" required></div><div class="field"><label>Senha</label><input type="password" name="password" placeholder="••••••••" required></div><button class="btn primary" type="submit">Entrar no painel →</button><div id="loginError" class="login-error"></div></form><a class="login-back" href="../index.html">← Voltar ao site</a></div><script src="../assets/appointment-config.js"></script><script>
const AUTH_KEY='kaliny_v19_session';
const SESSION_MS=30*60*1000;
const loginForm=document.getElementById('loginForm');
const loginButton=loginForm.querySelector('button[type=submit]');
const loginError=document.getElementById('loginError');
let backendWarm=false;
(async()=>{const s=JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null');if(s&&s.token&&Date.now()-new Date(s.loginAt).getTime()<SESSION_MS){location.href='../dashboard.html';return;}
  const url=String(APPOINTMENTS_API_URL||'').trim();
  if(!url||url.includes('COLE_AQUI'))return;
  try{const r=await fetch(url+'?action=ping',{cache:'no-store'});backendWarm=r.ok;}catch(e){}
})();
const DEVICE_KEY='kaliny_trusted_device';
const LOGIN_ERRORS={invalid_credentials:'E-mail ou senha inválidos.',too_many_attempts:'Muitas tentativas erradas. Por segurança, aguarde 15 minutos e tente novamente.',not_configured:'A senha do painel ainda não foi definida no Apps Script.',too_many_codes:'Muitos códigos enviados. Aguarde 15 minutos e tente novamente.',invalid_code:'Código incorreto. Confira o e-mail e tente de novo.',code_expired:'O código expirou. Clique em "Reenviar código".'};
function readDevice(){try{return localStorage.getItem(DEVICE_KEY)||''}catch(e){return ''}}
function saveDevice(t){try{if(t)localStorage.setItem(DEVICE_KEY,t)}catch(e){}}
// Etapa 2: código enviado por e-mail.
loginForm.insertAdjacentHTML('afterend',`<form id="codeForm" hidden style="animation:itemIn .3s ease-out both"><p id="codeInfo" style="margin:0 0 12px">Enviamos um código de 6 dígitos para o e-mail do escritório.</p><div class="field"><label>Código</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required style="letter-spacing:4px;font-size:20px;text-align:center"></div><label style="display:flex;gap:8px;align-items:center;margin:4px 0 14px;font-size:14px;text-transform:none;letter-spacing:0"><input type="checkbox" name="remember" checked style="width:auto"> Lembrar este aparelho por 30 dias</label><button class="btn primary" type="submit">Confirmar código →</button><div class="login-error" id="codeError"></div><p style="margin:14px 0 0;font-size:14px"><a href="#" id="resendCode">Reenviar código</a> · <a href="#" id="backToLogin">Voltar</a></p></form>`);
const codeForm=document.getElementById('codeForm'),codeError=document.getElementById('codeError'),codeButton=codeForm.querySelector('button[type=submit]');
let pending=null; // {email,password,challenge}
async function callServer(params){
  const url=String(APPOINTMENTS_API_URL||'').trim();if(!url||url.includes('COLE_AQUI'))throw new Error('not_configured_url');
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(params),signal:controller.signal,cache:'no-store'});return await r.json()}
  finally{clearTimeout(timeout)}
}
function netError(err){return err&&err.message==='not_configured_url'?'Servidor de autenticação não configurado.':err&&err.name==='AbortError'?'O servidor demorou para responder. Tente novamente.':'Não foi possível conectar ao servidor de autenticação.'}
// Quando outra pessoa entra neste aparelho, os dados guardados aqui da pessoa anterior são apagados (eles continuam na planilha).
const OWNER_KEY='kaliny_data_owner',PER_USER_KEYS=['kaliny_v6_data','kaliny_sync_meta_v1','kaliny_office_profile_v1','kaliny_recent_clients','kaliny_last_sync','kaliny_online_seen_ids','kaliny_online_seen_initialized','kaliny_documents_v1','kaliny_docs_dirty_v1','kaliny_team_v1'];
function switchOwner(email){try{const prev=localStorage.getItem(OWNER_KEY);if(prev&&prev!==email)PER_USER_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.setItem(OWNER_KEY,email)}catch(e){}}
function enter(j){
  if(j.deviceToken)saveDevice(j.deviceToken);
  switchOwner(String(j.user.email||'').toLowerCase());
  sessionStorage.setItem(AUTH_KEY,JSON.stringify({id:j.user.role==='colaboradora'?'usr_'+String(j.user.email).replace(/\W/g,'_'):'usr_kaliny',name:j.user.name,email:j.user.email,role:j.user.role,loginAt:new Date().toISOString(),expiresAt:j.expiresAt,token:j.token,mode:'server'}));
  location.href='../dashboard.html';
}
function showCodeStep(j){
  pending.challenge=j.challenge;
  document.getElementById('codeInfo').textContent='Enviamos um código de 6 dígitos para '+(j.sentTo||'o e-mail do escritório')+'. Ele vale por 10 minutos.';
  loginForm.hidden=true;codeForm.hidden=false;codeError.textContent='';codeForm.code.value='';codeForm.code.focus();
}
async function sendLogin(email,password){
  const j=await callServer({action:'login',email,password,device:readDevice()});
  if(j.ok)return enter(j);
  if(j.error==='code_required'){pending={email,password};return showCodeStep(j)}
  return j;
}
loginForm.onsubmit=async e=>{
 e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');loginError.textContent='';
 loginButton.disabled=true;loginButton.textContent='Entrando…';
 try{const j=await sendLogin(email,password);if(j&&!j.ok)loginError.textContent=LOGIN_ERRORS[j.error]||'Não foi possível autenticar agora.';}
 catch(err){console.error(err);loginError.textContent=netError(err);}
 finally{loginButton.disabled=false;loginButton.textContent='Entrar no painel →';}
};
codeForm.onsubmit=async e=>{
 e.preventDefault();codeError.textContent='';if(!pending)return;
 codeButton.disabled=true;codeButton.textContent='Confirmando…';
 try{const j=await callServer({action:'loginCode',challenge:pending.challenge,code:codeForm.code.value,remember:codeForm.remember.checked?'1':'0'});
   if(j.ok)return enter(j);
   codeError.textContent=LOGIN_ERRORS[j.error]||'Não foi possível confirmar agora.';}
 catch(err){console.error(err);codeError.textContent=netError(err);}
 finally{codeButton.disabled=false;codeButton.textContent='Confirmar código →';}
};
document.getElementById('resendCode').onclick=async e=>{
 e.preventDefault();if(!pending)return;codeError.textContent='Reenviando…';
 try{const j=await sendLogin(pending.email,pending.password);if(j&&!j.ok)codeError.textContent=LOGIN_ERRORS[j.error]||'Não foi possível reenviar agora.';else if(j===undefined&&!codeForm.hidden)codeError.textContent='Novo código enviado.';}
 catch(err){codeError.textContent=netError(err);}
};
document.getElementById('backToLogin').onclick=e=>{e.preventDefault();pending=null;codeForm.hidden=true;loginForm.hidden=false;};
// Convite da equipe: a pessoa cria a própria senha (link enviado por e-mail).
(function(){
  const q=new URLSearchParams(location.search),invite=q.get('convite'),email=(q.get('email')||'').trim().toLowerCase();if(!invite||!email)return;
  loginForm.hidden=true;
  loginForm.insertAdjacentHTML('beforebegin',`<form id="inviteForm" style="animation:itemIn .3s ease-out both"><p style="margin:0 0 12px">Bem-vinda! Crie sua senha para acessar o painel com <b>${email.replace(/[<>&"]/g,'')}</b>.</p><div class="field"><label>Nova senha (mínimo 10 caracteres)</label><input name="pw" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label>Repita a senha</label><input name="pw2" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn primary" type="submit" style="width:100%">Criar senha →</button><p id="inviteMsg" class="login-error" aria-live="polite"></p></form>`);
  const f=document.getElementById('inviteForm'),msg=document.getElementById('inviteMsg'),btn=f.querySelector('button');
  f.onsubmit=async e=>{e.preventDefault();msg.textContent='';
    if(f.pw.value.length<10){msg.textContent='Use pelo menos 10 caracteres.';return}
    if(f.pw.value!==f.pw2.value){msg.textContent='As duas senhas não são iguais.';return}
    btn.disabled=true;btn.textContent='Salvando…';
    try{const j=await callServer({action:'teamSetPassword',email,invite,password:f.pw.value});
      if(j.ok){f.remove();history.replaceState(null,'',location.pathname);loginForm.hidden=false;loginForm.email.value=email;loginForm.password.value='';loginError.style.color='#557a62';loginError.textContent='Senha criada! Agora entre com o seu e-mail e a senha nova.';loginForm.password.focus();return}
      msg.textContent=j.error==='invalid_invite'?'Este convite expirou ou já foi usado. Peça um novo convite ao escritório.':j.error==='too_many_attempts'?'Muitas tentativas. Aguarde 15 minutos.':j.error==='weak_password'?'Use pelo menos 10 caracteres.':'Não foi possível salvar agora.';}
    catch(err){msg.textContent=netError(err)}
    finally{btn.disabled=false;btn.textContent='Criar senha →'}};
})();
</script></body></html>
