<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área Restrita — Kaliny Girardi</title><link rel="stylesheet" href="css/style.css"></head><body class="login-body"><div class="login-card"><img class="login-logo" src="assets/logo.jpg" alt="Logo Kaliny Girardi"><span class="eyebrow">Área exclusiva</span><h1>Bem-vinda, Kaliny.</h1><p>Acesse o painel do escritório.</p><form id="loginForm"><div class="field"><label>E-mail</label><input type="email" name="email" placeholder="seu e-mail" required></div><div class="field"><label>Senha</label><input type="password" name="password" placeholder="••••••••" required></div><button class="btn primary" type="submit">Entrar no painel →</button><div id="loginError" class="login-error"></div><div class="login-demo">Acesso de demonstração<br><b>kaliny@demo.local</b> · <b>123456</b><br><small>Modo demonstração local — sem instalação ou servidor.</small></div></form><a class="login-back" href="index.html">← Voltar ao site</a></div><script>
const AUTH_KEY='kaliny_v19_session';
const USERS_KEY='kaliny_v19_users';
const AUDIT_KEY='kaliny_v19_audit';
const SESSION_MS=30*60*1000;
const defaultUsers=[{id:'usr_kaliny',name:'Kaliny Girardi',email:'kaliny@demo.local',passwordHash:'',role:'Administradora',active:true}];
async function hashPassword(value){try{if(window.crypto?.subtle){const data=new TextEncoder().encode(value);const buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(_){}let h=2166136261;for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function audit(action,meta=''){const a=JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]');a.unshift({id:'aud_'+Date.now(),at:new Date().toISOString(),action,meta});localStorage.setItem(AUDIT_KEY,JSON.stringify(a.slice(0,200)))}
(async()=>{const s=JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null');if(s&&Date.now()-new Date(s.loginAt).getTime()<SESSION_MS) location.href='dashboard.html';})();
document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const email=String(f.get('email')||'').trim().toLowerCase();
  const password=String(f.get('password')||'');
  const error=document.getElementById('loginError');
  error.textContent='';
  try{
    let users=JSON.parse(localStorage.getItem(USERS_KEY)||'null');
    if(!Array.isArray(users)) users=[];
    const demoEmail='kaliny@demo.local';
    let demo=users.find(x=>String(x.email||'').trim().toLowerCase()===demoEmail);
    if(!demo){
      demo={...defaultUsers[0],passwordHash:await hashPassword('123456')};
      users.unshift(demo);
    } else if(!demo.passwordHash){
      demo.passwordHash=await hashPassword('123456');
    }
    localStorage.setItem(USERS_KEY,JSON.stringify(users));
    const passwordHash=await hashPassword(password);
    const u=users.find(x=>String(x.email||'').trim().toLowerCase()===email&&x.passwordHash===passwordHash&&x.active!==false);
    if(!u){
      error.textContent='E-mail ou senha inválidos.';
      audit('login_failed',email);
      return;
    }
    const session={id:u.id,name:u.name,email:u.email,role:u.role,loginAt:new Date().toISOString(),mode:'local'};
    sessionStorage.setItem(AUTH_KEY,JSON.stringify(session));
    audit('login_success_local',email);
    location.href='dashboard.html';
  }catch(err){
    console.error(err);
    error.textContent='Não foi possível entrar. Atualize a página e tente novamente.';
  }
};
</script></body></html>
